<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>白板拔河・11班專屬樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="css/live.css?v=202610202039">
<style>
/* 🪢 白板拔河：手繪療癒風（扁平色塊＋深咖啡外框） */
body.cozy #app{background:#c8dea3}
.main{padding:12px 16px 14px}
.screen.active{height:100%}
.sticker{background:var(--cz-cream); border:4px solid var(--line); border-radius:18px; box-shadow:0 5px 0 var(--cz-shadow), 0 5px 0 4px var(--line)}

/* ── 設定畫面 ── */
.setup{max-width:860px; margin:0 auto; padding:22px 28px 26px; text-align:center}
.setup h2{margin:0 0 6px; font-size:clamp(1.8rem,3.4vw,2.6rem)}
.setup .vs-art{font-size:3rem; margin:2px 0 8px}
.setup .rules{text-align:left; margin:0 auto 14px; max-width:700px; padding-left:1.4em; font-size:clamp(1rem,1.7vw,1.25rem); line-height:1.7}
.row{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px; margin:10px 0; font-size:1.2rem; font-weight:700}
.row select{font-family:inherit; font-size:1.1rem; padding:8px 12px; border:3px solid var(--line); border-radius:14px; background:#fff; color:var(--line); max-width:min(520px,80vw)}
.row .btn.selected{background:#fde1e8; box-shadow:0 4px 0 var(--line), 0 0 0 4px #f7c4cf}
.name-in{font-family:inherit; font-size:1.25rem; width:9em; padding:8px 12px; border:3px solid var(--line); border-radius:14px; text-align:center; color:var(--line)}
.name-in.t0{background:#ffe6ec} .name-in.t1{background:#f6ead9}
.go{margin-top:12px; font-size:1.8rem !important; padding:10px 40px !important; background:#f7a8bb !important}
.src-info{font-size:.95rem; color:#8a6a5c; min-height:1.2em}

/* ── 對戰畫面 ── */
#scrGame.active{display:grid; grid-template-rows:auto minmax(0,1fr) minmax(0,1.25fr); gap:12px}
.top{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center}
.team-tag{display:flex; align-items:center; gap:10px; padding:6px 16px; font-size:clamp(1.2rem,2.2vw,1.9rem); font-weight:700; min-width:0}
.team-tag.r{justify-content:flex-end}
.team-tag .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.team-tag b{font-size:1.35em}
.pill{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; border:3px solid var(--line); font-size:1.5rem}
.timer{position:relative; padding:4px 22px; font-size:clamp(1.6rem,3vw,2.4rem); font-weight:700; text-align:center}
.timer.danger{background:#ffd9d9; animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.06)}}
.stop{position:absolute; top:-12px; right:-14px; min-width:0; min-height:0; width:34px; height:34px; border-radius:50%; border:3px solid var(--line); background:#fff; font-size:.95rem; padding:0; box-shadow:0 2px 0 var(--line)}
.stop.armed{width:auto; padding:0 10px; border-radius:999px; background:#ffd9d9; font-size:.9rem; font-weight:900; white-space:nowrap}
.stage{position:relative; min-height:0; border-radius:24px; overflow:hidden; border:4px solid var(--line); box-shadow:0 6px 0 var(--cz-shadow), 0 6px 0 4px var(--line); background:#fdf3e4}
.stage svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.pl{animation:bob 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%}
.pl:nth-child(2){animation-delay:-.35s} .pl:nth-child(3){animation-delay:-.7s}
@keyframes bob{50%{transform:translateY(-4px)}}
.yank0{animation:yank0 .4s ease} .yank1{animation:yank1 .4s ease}
@keyframes yank0{40%{transform:translateX(-14px)}}
@keyframes yank1{40%{transform:translateX(14px)}}
.bubble{opacity:0; transition:opacity .2s}
.bubble.show{opacity:1}

.panels{display:grid; grid-template-columns:1fr 1fr; gap:16px; min-height:0}
.panel{display:grid; grid-template-rows:auto auto minmax(0,1fr); gap:8px; padding:10px 14px 14px; min-height:0; position:relative}
.panel.t0{background:#ffe6ec} .panel.t1{background:#f6ead9}
.p-head{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:clamp(1rem,1.6vw,1.25rem)}
.combo{padding:0 12px; border-radius:999px; background:#ffe08a; border:3px solid var(--line); font-weight:900; visibility:hidden}
.combo.on{visibility:visible; animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}}
.q{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:.3em; min-height:2.6em; padding:6px 12px; border-radius:16px; background:#fff; border:3px solid var(--line); font-size:clamp(1.3rem,2.6vw,2.3rem); font-weight:700; text-align:center; line-height:1.35}
.q .q-img{max-height:16cqh; max-width:100%; border-radius:10px}
.q .eq{margin:0 .2em}
.opts{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:10px; min-height:0}
.opt{min-height:0; border-radius:18px; border:4px solid var(--line); background:#fff; box-shadow:0 5px 0 var(--line); font-size:clamp(1.3rem,2.6vw,2.3rem); font-weight:700; color:var(--line); display:flex; align-items:center; justify-content:center; gap:.4em; padding:4px 10px; line-height:1.25; transition:transform .08s, box-shadow .08s}
.opt .key{flex:0 0 auto; width:1.5em; height:1.5em; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:.6em; border:3px solid var(--line)}
.t0 .opt .key{background:#f7c4cf} .t1 .opt .key{background:#e8cfb2}
.opt:active{transform:translateY(3px); box-shadow:0 2px 0 var(--line)}
.opt.ok{background:#c9ecc0; animation:pop .3s ease}
.opt.bad{background:#ffc9c9; animation:shake .35s ease}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.panel.locked .opts{pointer-events:none}
.panel .float{position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); font-size:clamp(2rem,4vw,3.4rem); font-weight:900; pointer-events:none; animation:floatUp .9s ease forwards; text-shadow:0 3px 0 #fff}
@keyframes floatUp{from{opacity:1; transform:translate(-50%,-30%)}to{opacity:0; transform:translate(-50%,-120%)}}

/* 倒數、結束 */
.overlay{position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(91,64,56,.35)}
.count{font-size:min(30vh,14rem); font-weight:900; color:#fff; -webkit-text-stroke:6px var(--line); paint-order:stroke; animation:pop .5s ease}
.end-card{padding:26px 34px; text-align:center; max-width:760px; width:92%}
.end-card h2{margin:0 0 6px; font-size:clamp(2rem,4vw,3rem)}
.end-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0}
.end-team{padding:12px; border-radius:16px; border:3px solid var(--line); font-size:1.2rem; font-weight:700; line-height:1.7}
.end-team.t0{background:#ffe6ec} .end-team.t1{background:#f6ead9}
.end-team b{font-size:1.5em}
.icon-btn.music{right:70px} .icon-btn.music.off{opacity:.45}
.end-btns{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
</style>
</head>
<body class="cozy">
<div id="app">
  <header class="topbar">
    <a class="icon-btn left" href="live-host.html" aria-label="回 11班專屬樂園">🎡</a>
    <h1>🪢 白板拔河</h1>
    <button id="musicBtn" class="icon-btn right music" aria-label="背景音樂開關" title="背景音樂" >🎵</button>
    <button id="soundBtn" class="icon-btn right" aria-label="音效開關">🔊</button>
  </header>

  <main class="main">
    <!-- ── 設定 ── -->
    <section id="scrSetup" class="screen active">
      <div class="setup sticker">
        <h2>🪢 白板拔河</h2>
        <div class="vs-art">🐰 <span style="font-size:.6em">VS</span> 🐻</div>
        <ul class="rules">
          <li>不用 iPad！兩隊各派一位小朋友上台，在白板上點<b>自己那半邊</b>的答案。</li>
          <li>答對：繩子往自己這邊拉 1 格；連續答對 3 題以上，每題拉 <b>2 格</b>！🔥</li>
          <li>答錯：繩子被對方拉 1 格，會先看一下正確答案再換題。</li>
          <li>把蝴蝶結拉過<b>自己的終點</b>就立刻獲勝；時間到時偏向哪隊，哪隊就贏！</li>
        </ul>
        <div class="row">題目
          <select id="srcSel" aria-label="題目來源"><option value="auto">🎲 自動出題：分數擴分約分</option></select>
          <button id="srcRefresh" class="btn" aria-label="重新讀取題組" title="重新讀取題組">🔄</button>
        </div>
        <div class="src-info" id="srcInfo"></div>
        <div class="row" id="levelRow">難度
          <button class="btn level-btn selected" data-level="easy">🌱 簡單</button>
          <button class="btn level-btn" data-level="hard">🔥 挑戰</button>
        </div>
        <div class="row">時間
          <button class="btn time-btn" data-s="60">60 秒</button>
          <button class="btn time-btn selected" data-s="90">90 秒</button>
          <button class="btn time-btn" data-s="120">120 秒</button>
        </div>
        <div class="row">
          🐰 <input id="name0" class="name-in t0" maxlength="8" value="草莓兔兔隊" autocomplete="off">
          <span>VS</span>
          <input id="name1" class="name-in t1" maxlength="8" value="奶茶熊熊隊" autocomplete="off"> 🐻
        </div>
        <button id="goBtn" class="btn go">⚔️ 開始對決！</button>
      </div>
    </section>

    <!-- ── 對戰 ── -->
    <section id="scrGame" class="screen">
      <div class="top">
        <div class="team-tag sticker"><span class="pill" style="background:#f7c4cf">🐰</span><span class="nm" id="tName0"></span><b id="tScore0">0</b></div>
        <div class="timer sticker" id="timer">⏳ 90<button id="stopBtn" class="stop" aria-label="提早結束">✕</button></div>
        <div class="team-tag sticker r"><b id="tScore1">0</b><span class="nm" id="tName1"></span><span class="pill" style="background:#e8cfb2">🐻</span></div>
      </div>
      <div class="stage"><svg id="scene" viewBox="0 236 1200 314" preserveAspectRatio="xMidYMid meet" aria-label="拔河場景"></svg></div>
      <div class="panels">
        <div class="panel sticker t0" id="panel0">
          <div class="p-head"><span id="type0"></span><span class="combo" id="combo0"></span></div>
          <div class="q" id="q0"></div>
          <div class="opts" id="opts0"></div>
        </div>
        <div class="panel sticker t1" id="panel1">
          <div class="p-head"><span id="type1"></span><span class="combo" id="combo1"></span></div>
          <div class="q" id="q1"></div>
          <div class="opts" id="opts1"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="countOv" class="overlay hidden"><div class="count" id="countNum">3</div></div>
  <div id="endOv" class="overlay hidden">
    <div class="end-card sticker">
      <h2 id="endTitle"></h2>
      <div class="end-row" id="endRow"></div>
      <div class="end-btns">
        <button id="againBtn" class="btn btn-rose">🔁 再玩一次</button>
        <button id="setupBtn" class="btn">⚙️ 回設定</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="js/board-tug.js?v=202610202039"></script>
</body>
</html>
