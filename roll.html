<!doctype html>
<html lang="zh-Hant-TW" data-theme="rose">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抽籤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="board compact-page roll-page">
  <header class="board-header">
    <div class="board-title">
      <h1 id="class-name">最閃亮的11班</h1>
      <p id="date" class="date"></p>
      <nav class="board-nav" aria-label="切換頁面">
        <a href="index.html">作業燈號</a>
        <a href="contact.html">聯絡簿</a>
        <a href="roll.html" class="active" aria-current="page">抽籤</a>
      </nav>
    </div>
    <div id="clock" class="clock" aria-label="現在時間"></div>
  </header>

  <main class="lottery-layout">
    <section class="lottery-stage" id="lottery"></section>

    <section class="lottery-side">
      <div class="lottery-result">
        <div id="big-ball" class="big-marble empty"><span id="big-num">?</span></div>
        <p id="caption" class="roll-caption">按下面的按鈕開始抽籤</p>
      </div>

      <button id="draw-btn" class="btn primary roll-go" type="button">🎲 搖一搖，抽一顆！</button>

      <label class="switch">
        <input id="put-back" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
        <span>抽到的球放回去</span>
      </label>

      <div class="tray" id="tray-box">
        <p class="tray-title"><span id="tray-title">已抽出的球</span> <span class="muted tray-hint">點一顆可以放回去</span></p>
        <div id="tray" class="tray-balls"></div>
      </div>

      <div class="lottery-actions">
        <button id="reset-btn" class="btn" type="button">🔄 全部放回（重置）</button>
        <button id="sound-btn" class="btn ghost" type="button"></button>
      </div>
    </section>
  </main>

  <script type="module" src="js/roll.js"></script>
</body>
</html>
