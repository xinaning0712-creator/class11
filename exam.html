<!doctype html>
<html lang="zh-Hant-TW" data-theme="rose">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考試</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202611021513">
  <link rel="stylesheet" href="css/exam.css?v=202611021513">
</head>
<body class="board compact-page exam-page">
  <header class="board-header">
    <div class="board-title">
      <h1 id="class-name">最閃亮的11班</h1>
      <nav class="board-nav" aria-label="切換頁面">
        <a href="index.html">作業燈號</a>
        <a href="contact.html">聯絡簿</a>
        <a href="roll.html">抽籤</a>
        <a href="exam.html" class="active" aria-current="page">考試</a>
        <a href="fraction.html">分數冒險</a>
        <a href="live-host.html">全班對戰</a>
      </nav>
    </div>
  </header>

  <main class="exam-layout">
    <section class="exam-left">
      <div class="exam-heading">
        <h2 id="exam-title">考試</h2>
        <div id="exam-days" class="exam-days" aria-label="考試日"></div>
      </div>

      <button id="exam-clock" class="exam-clock" type="button" aria-label="現在時間，點一下切換指針或數字時鐘">
        <svg id="analog" class="exam-analog" viewBox="0 0 200 200" aria-hidden="true" hidden></svg>
        <span class="exam-clock-text">
          <span id="digital" class="exam-digital"></span>
          <span id="exam-date" class="exam-date"></span>
        </span>
      </button>

      <p id="exam-status" class="exam-status" aria-live="polite"></p>
      <ol id="exam-slots" class="exam-slots"></ol>
    </section>

    <section class="exam-right">
      <div class="exam-stats">
        <div class="exam-stat"><span>班級人數</span><strong id="stat-class">–</strong></div>
        <div class="exam-stat main"><span>應考人數</span><strong id="stat-exam">–</strong></div>
        <div class="exam-stat"><span>缺考</span><strong id="stat-absent">0</strong><em id="stat-absent-list"></em></div>
      </div>

      <div class="exam-room">
        <div class="exam-podium">講　台</div>
        <div id="exam-seats" class="exam-seats" aria-label="座位表，點座號可以標記缺考"></div>
        <p class="exam-hint">點座號標記缺考，再點一次取消</p>
      </div>

      <p id="exam-note" class="exam-note" hidden></p>
    </section>
  </main>

  <button id="exam-fs" class="corner-btn" type="button" aria-label="全螢幕">⛶</button>

  <script type="module" src="js/exam.js?v=202611021513"></script>
</body>
</html>
