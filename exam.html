<!doctype html>
<html lang="zh-Hant-TW" data-theme="rose">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考試</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202611061447">
  <link rel="stylesheet" href="css/exam.css?v=202611061447">
</head>
<body class="board compact-page exam-page">
  <main class="exam-layout">
    <section class="exam-left">
      <div class="exam-heading">
        <h2 id="exam-title">考試</h2>
        <div id="exam-days" class="exam-days" aria-label="考試日"></div>
      </div>

      <button id="exam-clock" class="exam-clock" type="button" aria-label="現在時間，點一下切換指針或數字時鐘">
        <svg id="analog" class="exam-analog" viewBox="0 0 200 200" aria-hidden="true" hidden></svg>
        <span class="exam-clock-text">
          <span id="digital" class="exam-digital"></span>
          <span id="exam-date" class="exam-date"></span>
        </span>
      </button>

      <p id="exam-status" class="exam-status" aria-live="polite"></p>
      <div id="exam-progress" class="exam-progress" aria-hidden="true" hidden><i id="exam-bar"></i></div>
      <div id="exam-audio" class="exam-audio" hidden>
        <audio id="audio" preload="auto"></audio>
        <button id="au-play" class="btn primary" type="button">▶ 播放英聽</button>
        <button id="au-back" class="btn" type="button" aria-label="倒回 10 秒">⟲ 10 秒</button>
        <button id="au-start" class="btn" type="button" aria-label="回到開頭">⏮</button>
        <input id="au-seek" class="exam-audio-seek" type="range" min="0" max="1000" value="0" aria-label="英聽進度，可以拖拉">
        <span id="au-time" class="exam-audio-time">00:00</span>
      </div>

      <ol id="exam-slots" class="exam-slots"></ol>
    </section>

    <section class="exam-right">
      <div class="exam-stats">
        <div class="exam-stat"><span>班級人數</span><strong id="stat-class">–</strong></div>
        <div class="exam-stat main"><span>應考人數</span><strong id="stat-exam">–</strong></div>
        <div class="exam-stat"><span>缺考</span><strong id="stat-absent">0</strong><em id="stat-absent-list"></em></div>
      </div>

      <div class="exam-room">
        <div class="exam-podium">講　台</div>
        <div id="exam-seats" class="exam-seats" aria-label="座位表，點座號可以標記缺考"></div>
      </div>

      <p id="exam-note" class="exam-note" hidden></p>
    </section>
  </main>

  <!-- 考試時不顯示其他頁面的文字（可能是考試生字），回主畫面只留圖示 -->
  <div id="exam-themes" class="exam-themes" hidden></div>
  <button id="exam-theme-btn" class="corner-btn exam-themes-btn" type="button" aria-label="換風格" aria-expanded="false">🎨</button>
  <a class="corner-btn exam-home" href="index.html" aria-label="回主畫面">⌂</a>
  <button id="exam-fs" class="corner-btn" type="button" aria-label="全螢幕">⛶</button>

  <script type="module" src="js/exam.js?v=202611061447"></script>
</body>
</html>
