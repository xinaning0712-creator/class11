<!doctype html>
<html lang="zh-Hant-TW" data-theme="rose">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聯絡簿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <script>
    // 字體預覽：網址加 ?font=huninn 會換成粉圓（這個分頁會記住），加 ?font=off 關掉
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('font');
        if (q === 'huninn') sessionStorage.setItem('shiny11-font', 'huninn');
        if (q === 'off') sessionStorage.removeItem('shiny11-font');
        if (sessionStorage.getItem('shiny11-font') !== 'huninn') return;
        document.documentElement.setAttribute('data-font', 'huninn');
        document.addEventListener('DOMContentLoaded', function () {
          var a = document.createElement('a');
          a.className = 'font-preview-badge';
          a.href = location.pathname + '?font=off';
          a.textContent = '🧪 粉圓預覽中・點這裡關閉';
          document.body.appendChild(a);
        });
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=202610142003">
</head>
<body class="board compact-page contact-page">
  <header class="board-header">
    <div class="board-title">
      <h1 id="class-name">最閃亮的11班</h1>
      <p id="date" class="date"></p>
      <nav class="board-nav" aria-label="切換頁面">
        <a href="index.html">作業燈號</a>
        <a href="contact.html" class="active" aria-current="page">聯絡簿</a>
        <a href="roll.html">抽籤</a>
        <a href="fraction.html">分數冒險</a>
        <a href="live-host.html">全班對戰</a>
      </nav>
    </div>
    <div id="clock" class="clock" aria-label="現在時間"></div>
  </header>

  <div class="contact-body">
    <main class="contact-frame" id="frame">
      <p class="empty">載入中…</p>
    </main>
    <aside id="countdown" class="countdown-panel" aria-label="倒數日" hidden></aside>
  </div>

  <script type="module" src="js/contact.js?v=202610142003"></script>
</body>
</html>
